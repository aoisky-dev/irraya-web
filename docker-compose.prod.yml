services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-irraya}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-irraya}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ./backend
    image: irraya/backend:local
    container_name: irraya-web-backend
    restart: unless-stopped
    env_file:
      - ./deploy/prod/backend.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-irraya}
      REDIS_URL: redis://redis:6379
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      STORE_CORS: ${STORE_CORS}
      ADMIN_CORS: ${ADMIN_CORS}
      AUTH_CORS: ${AUTH_CORS}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.irraya.com`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=9000"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    init: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - backend_uploads:/app/uploads

  nginx:
    image: nginx:alpine
    container_name: irraya-web-nginx
    restart: unless-stopped
    volumes:
      - backend_uploads:/usr/share/nginx/html/uploads:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nginx.rule=Host(`api.irraya.com`) && PathPrefix(`/uploads`)"
      - "traefik.http.routers.nginx.entrypoints=websecure"
      - "traefik.http.routers.nginx.tls.certresolver=letsencrypt"
      - "traefik.http.services.nginx.loadbalancer.server.port=80"
      - "traefik.http.routers.nginx.priority=100"
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
    image: irraya/frontend:local
    container_name: irraya-web-frontend
    restart: unless-stopped
    env_file:
      - ./deploy/prod/frontend.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`irraya.com`) || Host(`www.irraya.com`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    depends_on:
      - backend
    init: true
    security_opt:
      - no-new-privileges:true

volumes:
  redis_data:
  postgres_data:
  backend_uploads:
