services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-irraya}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-irraya}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ./backend
    image: irraya/backend:local
    restart: unless-stopped
    env_file:
      - ./deploy/prod/backend.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@127.0.0.1:5432/${POSTGRES_DB:-irraya}
      REDIS_URL: redis://127.0.0.1:6379
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    init: true
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
    image: irraya/frontend:local
    restart: unless-stopped
    env_file:
      - ./deploy/prod/frontend.env
    depends_on:
      - backend
    init: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:3000"


volumes:
  redis_data:
  postgres_data:

